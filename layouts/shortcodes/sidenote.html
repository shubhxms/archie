{{- $content := .Inner | .Page.RenderString -}}
{{- .Page.Store.Add "sidenotes" (slice (dict "ordinal" .Ordinal "content" $content)) -}}
<span class="sidenote-outer" id="sn-{{ .Ordinal }}-anchor">
  <label class="sidenote-toggle" for="sn-{{ .Ordinal }}"></label>
  <input class="sidenote-state" id="sn-{{ .Ordinal }}" type="checkbox">
  <span class="sidenote-inline">{{ $content }}</span>
</span>
